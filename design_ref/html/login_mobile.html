<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-gradient {
            background: linear-gradient(135deg, #176a21 0%, #025d16 100%);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body antialiased min-h-screen flex flex-col items-center">
<!-- Hero Orchard Background Image -->
<div class="fixed inset-0 z-0">
<img class="w-full h-full object-cover opacity-30" data-alt="Dreamy soft focus view of a sun-drenched orchard with ripe apples hanging from branches and dappled sunlight on green leaves" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDDF28oGUswaYig5qbiThD0jcnREmB64fkxDUXUGIMZQjaweD75-ngt_B9vPooqII9oacyBz96PjOuXgpeD06X_MbJUJ65OeXVliy1xfYReMb1kj1ZfdCby5RWiO2I05wyj5VtupRdnkrQOtd_vaccqTjrgRi0Q7JhM6vAqlFbvblxI-PA7ecSyfu7E4HperVGKq6KQnx7ASotm3aSp8GI0M1aylgQVCPxXAZg1CxMwK52CXjcVx1-gmtQAL09o0wl-160_Yv_Mi-tA"/>
<div class="absolute inset-0 bg-gradient-to-b from-background/40 via-background/80 to-background"></div>
</div>
<main class="relative z-10 w-full max-w-md px-6 pt-16 pb-12 flex flex-col items-center min-h-screen">
<!-- Brand Header -->
<div class="text-center mb-12">
<div class="inline-flex items-center justify-center p-4 rounded-xl bg-primary-container mb-6 shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="potted_plant">potted_plant</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tight text-on-background mb-2">BlissFruitz</h1>
<p class="text-on-surface-variant font-medium">The Harvest is Ready for You</p>
</div>
<!-- Login Form Container -->
<div class="w-full space-y-8">
<div class="space-y-4">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label font-semibold text-sm text-on-surface-variant ml-2">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant font-medium transition-all" placeholder="hello@orchard.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label font-semibold text-sm text-on-surface-variant ml-2">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline-variant font-medium transition-all" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Options -->
<div class="flex items-center justify-between px-2">
<label class="flex items-center gap-3 cursor-pointer group">
<div class="relative">
<input class="peer sr-only" type="checkbox"/>
<div class="w-10 h-6 bg-surface-container-highest rounded-full peer-checked:bg-primary transition-colors"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full peer-checked:translate-x-4 transition-transform"></div>
</div>
<span class="text-sm font-semibold text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="text-sm font-bold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Sign In Button -->
<button class="editorial-gradient w-full h-16 rounded-full text-on-primary font-headline font-bold text-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                Sign In
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-surface-container-highest"></div>
<span class="flex-shrink mx-4 text-sm font-semibold text-outline-variant uppercase tracking-widest">Or Continue With</span>
<div class="flex-grow border-t border-surface-container-highest"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="h-14 rounded-2xl bg-surface-container-lowest border border-surface-variant/30 flex items-center justify-center gap-3 hover:bg-surface-container-low transition-all active:scale-95 shadow-sm">
<img alt="Google" class="w-6 h-6 object-contain" data-alt="Google colorful brand logo icon representing a modern tech-integrated login method" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPvu6cK-wpQb6VEZL_BXA0M2lZsnuBUYTH5daMG2iksxzXY92N2DnzihUhLuRIaE7u1obegsz5P7-xTu2wj8Gpu1Kww_vwmKxV_ZWM_e1k7raq2L44fbZK7MhlAg54j0GE5Q5MTR5lhJG58T8ap56RJAoDbq8zs0k-qLG1SsyxbTG8liiuG8ZGviogtaaW1YO7186YsMJFGRolUlWR8L2_dnyj4eHWgY_I-TzxpiLaFJY5ZyDq6qED3cipfbvgCuaPOwmPM3kClY8X"/>
<span class="font-headline font-bold text-on-surface">Google</span>
</button>
<button class="h-14 rounded-2xl bg-inverse-surface flex items-center justify-center gap-3 hover:opacity-90 transition-all active:scale-95 shadow-sm">
<span class="material-symbols-outlined text-white" data-icon="apple" style="font-variation-settings: 'FILL' 1;">ios</span>
<span class="font-headline font-bold text-white">Apple</span>
</button>
</div>
</div>
<!-- Footer Footer Link -->
<div class="mt-auto pt-8">
<p class="text-on-surface-variant font-medium">
                Don't have an account? 
                <a class="text-secondary font-bold hover:underline underline-offset-4 ml-1" href="#">Create Account</a>
</p>
</div>
</main>
<!-- Bottom Decorative Orchard Vignette -->
<div class="fixed bottom-0 left-0 w-full h-32 pointer-events-none bg-gradient-to-t from-primary-container/20 to-transparent"></div>
</body></html>
