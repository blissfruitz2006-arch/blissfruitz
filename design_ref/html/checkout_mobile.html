<label class="block relative group">

<div class="ml-4 flex items-center gap-3">
<div class="w-10 h-10 bg-orange-50 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-orange-700">payments</span>
</div>
<div>
<p class="font-bold text-on-surface">Cash on Delivery</p>
<p class="text-xs text-on-surface-variant">Pay when you receive the fruit</p>

</div>
