name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7' # Matches the local environment
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create placeholder env files
        run: |
          mkdir -p assets
          touch assets/supabase_env.txt
          touch assets/env_config.txt

      - name: Build Customer APK
        if: github.repository == 'blissfruitz2006-arch/blissfruitz'
        run: |
          flutter build apk --release --flavor customer \
            --dart-define=APP_FLAVOR=customer \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }} \
            --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-customer-release.apk build/app/outputs/flutter-apk/blissfruitz-customer.apk

      - name: Build Rider APK
        if: github.repository == 'blissfruitz2006-arch/blissfruitz-rider'
        run: |
          flutter build apk --release --flavor rider \
            --dart-define=APP_FLAVOR=rider \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }} \
            --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-rider-release.apk build/app/outputs/flutter-apk/blissfruitz-rider.apk

      - name: Create Customer Release
        if: github.repository == 'blissfruitz2006-arch/blissfruitz'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/blissfruitz-customer.apk
          name: Customer Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: "Official BlissFruitz Customer App Update.\n\nWhat's New:\n- 🚀 Improved Android 16 (and 15) compatibility for seamless updates.\n- 🤖 New AI Support Assistant for instant customer help.\n- ⚡ Performance optimizations and stability fixes."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Rider Release
        if: github.repository == 'blissfruitz2006-arch/blissfruitz-rider'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/blissfruitz-rider.apk
          name: Rider Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: "Official BlissFruitz Rider App Update."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
