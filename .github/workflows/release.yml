name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7' # Matches the local environment
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Customer APK
        if: github.repository == 'blissfruitz2006-arch/blissfruitz'
        run: |
          flutter build apk --release --flavor customer \
            --dart-define=APP_FLAVOR=customer \
            --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-customer-release.apk build/app/outputs/flutter-apk/blissfruitz-customer.apk

      - name: Build Rider APK
        if: github.repository == 'blissfruitz2006-arch/blissfruitz-rider'
        run: |
          flutter build apk --release --flavor rider \
            --dart-define=APP_FLAVOR=rider \
            --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-rider-release.apk build/app/outputs/flutter-apk/blissfruitz-rider.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/blissfruitz-customer.apk
            build/app/outputs/flutter-apk/blissfruitz-rider.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          body: |
            ## BlissFruitz Release ${{ github.ref_name }}
            
            This release contains the latest update for the application.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
