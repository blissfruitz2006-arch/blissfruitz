  <!-- SEO: JavaScript helpers for dynamic meta tag and schema updates from Dart -->
  <script>
    // Called from Dart via js_interop to update meta tags per route
    window.updateSeoMeta = function(title, description, url, imageUrl) {
      if (title) {
        document.title = title;
        var ogTitle = document.querySelector('meta[property="og:title"]');
        if (ogTitle) ogTitle.setAttribute('content', title);
        var twTitle = document.querySelector('meta[name="twitter:title"]');
        if (twTitle) twTitle.setAttribute('content', title);
      }
      if (description) {
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute('content', description);
        var ogDesc = document.querySelector('meta[property="og:description"]');
        if (ogDesc) ogDesc.setAttribute('content', description);
        var twDesc = document.querySelector('meta[name="twitter:description"]');
        if (twDesc) twDesc.setAttribute('content', description);
      }
      if (url) {
        var ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', url);
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute('href', url);
      }
      if (imageUrl) {
        var ogImg = document.querySelector('meta[property="og:image"]');
        if (ogImg) ogImg.setAttribute('content', imageUrl);
        var twImg = document.querySelector('meta[name="twitter:image"]');
        if (twImg) twImg.setAttribute('content', imageUrl);
      }
    };

    // Called from Dart to inject JSON-LD schema into <head>
    window.injectJsonLd = function(jsonString, elementId) {
      var existing = document.getElementById(elementId);
      if (existing) existing.remove();
      var script = document.createElement('script');
      script.type = 'application/ld+json';
      script.id = elementId;
      script.textContent = jsonString;
      document.head.appendChild(script);
    };

    // Called from Dart to remove a dynamic schema
    window.removeJsonLd = function(elementId) {
      var existing = document.getElementById(elementId);
      if (existing) existing.remove();
    };

    window.addEventListener('load', function(ev) {
      // The loading indicator is automatically removed by the Flutter engine 
      // when it's ready, but we can also hide it explicitly if needed.
    });
  </script>
