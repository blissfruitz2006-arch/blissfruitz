name: blissfruitz
description: "BlissFruitz — Premium Fresh Fruits E-Commerce App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Images
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # HTML rendering (blog content)
  flutter_html: ^3.0.0-beta.2

  # URL strategy (clean URLs for web)
  url_strategy: ^0.3.0

  # Formatting
  intl: ^0.19.0

  # Payments
  razorpay_flutter: ^1.3.5

  # Loading shimmer
  shimmer: ^3.0.0

  # Local storage
  shared_preferences: ^2.3.4

  # URL launcher
  url_launcher: ^6.3.1
  image_picker: ^1.2.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.1
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.3
  share_plus: ^10.1.4
  csv: ^6.0.0
  barcode: ^2.2.8
  flutter_dotenv: ^5.2.1
  flutter_html_table: 3.0.0-beta.2
  ota_update: ^7.0.1
  package_info_plus: ^8.1.1
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  firebase_core: ^4.7.0
  pinput: ^5.0.1
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.6.4
  mocktail: ^1.0.4
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - supabase_env.txt
